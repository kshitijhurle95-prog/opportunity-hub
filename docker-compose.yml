services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-opportunity-tracker
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/data/config:ro
      - ./resumes:/data/resumes:ro

  # Headless browser container for scraping sites requiring browser automation
  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless-chrome
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - CONCURRENT=5
      - QUEUE_LENGTH=10
      - TIMEOUT=60000

volumes:
  n8n_data:
